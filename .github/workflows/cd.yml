name: Continuous Delivery & Deploy (CD)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện Actions nếu muốn

jobs:
  verify-and-build:
    name: 🧪 Unit Test & Build Client
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: 📦 Install Server Dependencies & Run Test
        working-directory: ./server
        env:
          MONGO_URI: mongodb://localhost:27017/spendwise_test
          NODE_ENV: test
        run: |
          npm ci
          npm test

      - name: 📦 Install Client Dependencies & Build
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: 📂 Prepare Release Bundle
        run: |
          mkdir -p release/client/dist release/server
          cp -r client/dist/* release/client/dist/
          cp -r server/* release/server/
          cp ecosystem.config.js release/

      - name: 💾 Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/
          retention-days: 1

  deploy-vps:
    name: 🚀 Deploy to VPS & Health Check
    runs-on: ubuntu-latest
    needs: verify-and-build

    steps:
      - name: 📥 Download Release Bundle Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle

      - name: 📤 Transfer files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "release-bundle/*"
          target: "/var/www/spendwise"
          strip_components: 1

      - name: ⚡ Reload PM2 & Run Health Check on VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            echo "📁 Di chuyển vào thư mục server trên VPS..."
            cd /var/www/spendwise/server
            npm install --omit=dev
            cd /var/www/spendwise
            echo "🔄 Khởi động lại ứng dụng SpendWise API (Zero-downtime reload)..."
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save
            echo "⏳ Đợi 5s cho ứng dụng sẵn sàng..."
            sleep 5
            echo "🏥 Thực hiện Health Check nội bộ (http://127.0.0.1:5000/api/health)..."
            curl -f http://127.0.0.1:5000/api/health || (echo "❌ Health Check Thất Bại! Ứng dụng lỗi!" && exit 1)
            echo "✅ Health Check Thành Công! Ứng dụng đang hoạt động tốt."

      - name: 🌍 Kiểm tra Health Check HTTPS Public (Từ Runner)
        run: |
          echo "🔍 Kiểm tra public endpoint: https://${{ secrets.DOMAIN }}/api/health ..."
          curl -f -s https://${{ secrets.DOMAIN }}/api/health | grep '"status":"ok"' || echo "⚠️ Lưu ý: Public HTTPS chưa phản hồi (Có thể Nginx/Domain đang thiết lập ở Giai đoạn 3)"

  notify:
    name: 🔔 Telegram Notification
    runs-on: ubuntu-latest
    needs: [verify-and-build, deploy-vps]
    if: always() # Chạy trong cả trường hợp thành công hoặc thất bại

    steps:
      - name: 🟢 Gửi thông báo THÀNH CÔNG (Success)
        if: ${{ needs.verify-and-build.result == 'success' && needs.deploy-vps.result == 'success' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            ✅ <b>[SpendWise DevOps] Deploy THÀNH CÔNG!</b>
            👤 <b>Người thực hiện:</b> ${{ github.actor }}
            💬 <b>Commit:</b> <code>${{ github.event.head_commit.message }}</code>
            🌐 <b>Trạng thái:</b> Sổ Thu Chi FinFlow đã được cập nhật bản mới nhất lên VPS!
            🔗 <a href="https://github.com/${{ github.repository }}">Xem Repository</a>

      - name: 🔴 Gửi thông báo THẤT BẠI (Failure)
        if: ${{ needs.verify-and-build.result == 'failure' || needs.deploy-vps.result == 'failure' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            ❌ <b>[SpendWise DevOps] Deploy THẤT BẠI / Health Check lỗi!</b>
            ⚠️ <i>Pipeline CI/CD đã chặn code lỗi không cho lên Production. Website hiện giữ nguyên bản cũ hoạt động bình thường.</i>
            👤 <b>Người thực hiện:</b> ${{ github.actor }}
            💬 <b>Commit:</b> <code>${{ github.event.head_commit.message }}</code>
            🔍 <b>Vào xem log lỗi ngay tại:</b>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}</a>
